upstream crm_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name api.sahyak.com crm.sahyak.com;

    root /home/ubuntu/mobile-crm/frontend/out;
    index index.html;

    client_max_body_size 50M;

    # Gzip compression for blazing speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Backend API & Webhooks (Proxied to upstream with keepalive)
    location /api/ {
        proxy_pass http://crm_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # Static file uploads
    location /uploads/ {
        proxy_pass http://crm_backend/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Next.js Static Asset Caching (Immutable, long cache)
    location /_next/static/ {
        alias /home/ubuntu/mobile-crm/frontend/out/_next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public static files (images, icons)
    location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Frontend Single Page App / SSG Routing (No-cache for HTML shells)
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
        add_header Cache-Control "no-cache";
    }
}
