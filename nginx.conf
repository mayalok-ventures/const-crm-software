server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name api.sahyak.com 13.60.24.220 _;

    root /home/ubuntu/mobile-crm/frontend/out;
    index index.html;

    client_max_body_size 50M;

    # Gzip compression for blazing speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Backend API & Webhooks
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    # Static file uploads
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Next.js Static Asset Caching
    location /_next/static/ {
        alias /home/ubuntu/mobile-crm/frontend/out/_next/static/;
        expires 365d;
        access_log off;
    }

    # Frontend Single Page App / SSG Routing
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }
}
