name: Deploy Backend to Zoho Catalyst AppSail

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'catalyst.json'
  workflow_dispatch:

concurrency:
  group: production-zoho-backend-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Backend Validation & Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: TypeScript Compilation & Type Validation
        working-directory: ./backend
        run: npm run build

      - name: Start MongoDB Service Container
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'

      - name: Run Backend Regression & Security Test Suites
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/test-crm-ci
          JWT_SECRET: crm_jwt_secret_dev_key_2026_super_secure_32_chars_ci
          INTEGRATION_ENCRYPTION_KEY: crm_default_integration_aes_key_32_bytes_2026
        run: |
          echo "=========================================================="
          echo "Running Deployment Tracking Unit Tests..."
          echo "=========================================================="
          node tests/deployments_releases_tracking.test.js

          echo "=========================================================="
          echo "Running Database Monitoring & Diagnostic Tests..."
          echo "=========================================================="
          node tests/database_monitoring.test.js

          echo "=========================================================="
          echo "Running Integration Architecture & Security Audit..."
          echo "=========================================================="
          node tests/integration_architecture_audit.test.js

          echo "=========================================================="
          echo "Running Self-Service Lead Ingestion & Isolation Tests..."
          echo "=========================================================="
          node tests/self_service_lead_integration.test.js

  deploy-to-appsail:
    name: Deploy to Zoho Catalyst AppSail
    needs: test-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zoho Catalyst CLI
        run: |
          npm install -g zcatalyst-cli@latest
          echo "Zoho Catalyst CLI Version:"
          catalyst -v

      - name: Validate Required Zoho Deployment Secrets
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          if [ -z "$CATALYST_TOKEN" ]; then
            echo "::error::Missing secret CATALYST_TOKEN. Generate via 'catalyst token:generate --current' and add to GitHub Secrets."
            exit 1
          fi
          echo "✅ Mandatory deployment authentication token is present."

      - name: Build & Prepare Clean Production Bundle
        working-directory: ./backend
        run: |
          echo "Installing dependencies and compiling TypeScript..."
          npm ci
          npm run build
          echo "Pruning devDependencies for clean container packaging..."
          npm prune --omit=dev

      - name: Deploy to Zoho Catalyst AppSail
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
          CATALYST_PROJECT: ${{ secrets.CATALYST_PROJECT_NAME || '91974000000013053' }}
          CATALYST_ORG: ${{ secrets.CATALYST_ORG || '60093521877' }}
          CATALYST_DC: ${{ secrets.CATALYST_DC || 'in' }}
          APPSAIL_NAME: ${{ secrets.CATALYST_APPSAIL_NAME || 'sahyak-backend' }}
        run: |
          echo "🚀 Deploying AppSail service [$APPSAIL_NAME] to Catalyst Project [$CATALYST_PROJECT] (Org: $CATALYST_ORG, DC: $CATALYST_DC)..."

          DEPLOY_ARGS=(
            "deploy" "appsail"
            "--project" "$CATALYST_PROJECT"
            "--token" "$CATALYST_TOKEN"
            "--org" "$CATALYST_ORG"
            "--dc" "$CATALYST_DC"
            "--name" "$APPSAIL_NAME"
            "--build-path" "./backend"
            "--stack" "node20"
            "--command" "node server.js"
            "--non-interactive"
            "--verbose"
          )

          catalyst "${DEPLOY_ARGS[@]}" 2>&1 | tee /tmp/catalyst_deploy.log

          # Capture assigned AppSail URL if outputted by Catalyst CLI
          ASSIGNED_URL=$(grep -oiE 'https://[a-zA-Z0-9.-]+\.catalystappsail\.[a-z]+' /tmp/catalyst_deploy.log | head -n 1 || true)
          if [ -n "$ASSIGNED_URL" ]; then
            echo "DEPLOYED_APPSAIL_URL=$ASSIGNED_URL" >> $GITHUB_ENV
            echo "📍 Captured deployed AppSail URL from CLI: $ASSIGNED_URL"
          fi

      - name: Verify Live Deployment Health & Readiness
        env:
          CONFIGURED_URL: ${{ secrets.BACKEND_API_URL }}
        run: |
          # Priority: User-configured secret -> Captured CLI deployment URL -> Default canonical domain
          if [ -n "$CONFIGURED_URL" ]; then
            TARGET_URL="${CONFIGURED_URL%/}"
          elif [ -n "$DEPLOYED_APPSAIL_URL" ]; then
            TARGET_URL="${DEPLOYED_APPSAIL_URL%/}"
          else
            TARGET_URL="https://api.sahyak.com"
          fi

          echo "=========================================================="
          echo "🔍 Post-Deployment Health Check Verification on: $TARGET_URL"
          echo "=========================================================="

          MAX_ATTEMPTS=12
          DELAY_SECONDS=15
          SUCCESS=0

          echo "Waiting 25 seconds for AppSail container initialization and cutover..."
          sleep 25

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i of $MAX_ATTEMPTS: Checking $TARGET_URL/health and $TARGET_URL/health/ready..."

            HEALTH_HTTP_CODE=$(curl -s -o /tmp/health_res.json -w "%{http_code}" "$TARGET_URL/health" || echo "000")
            READY_HTTP_CODE=$(curl -s -o /tmp/ready_res.json -w "%{http_code}" "$TARGET_URL/health/ready" || echo "000")

            echo "  /health HTTP Status: $HEALTH_HTTP_CODE"
            echo "  /health/ready HTTP Status: $READY_HTTP_CODE"

            IS_READY=0
            if [ "$READY_HTTP_CODE" = "200" ] && grep -Eq '"ready"\s*:\s*true' /tmp/ready_res.json 2>/dev/null; then
              IS_READY=1
            fi

            if [ "$HEALTH_HTTP_CODE" = "200" ] && [ "$IS_READY" -eq 1 ]; then
              echo "✅ Health and readiness checks passed!"
              echo "--- /health response ---"
              cat /tmp/health_res.json
              echo ""
              echo "--- /health/ready response ---"
              cat /tmp/ready_res.json
              echo ""
              SUCCESS=1
              break
            fi

            echo "Endpoints not ready yet. Retrying in $DELAY_SECONDS seconds..."
            sleep $DELAY_SECONDS
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Deployment Verification Failed: Backend failed health checks after $MAX_ATTEMPTS attempts."
            echo "Last /health response (Code: $HEALTH_HTTP_CODE):"
            cat /tmp/health_res.json 2>/dev/null || true
            echo ""
            echo "Last /health/ready response (Code: $READY_HTTP_CODE):"
            cat /tmp/ready_res.json 2>/dev/null || true
            echo ""
            exit 1
          fi

          echo "=========================================================="
          echo "🎉 Automatic Backend Deployment & Verification SUCCESSFUL!"
          echo "=========================================================="
