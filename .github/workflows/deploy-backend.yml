name: Deploy Backend to Zoho Catalyst AppSail

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
      - 'catalyst.json'
      - 'app-config.json'
      - '.catalystignore'
      - '.catalystrc'
  workflow_dispatch:

concurrency:
  group: production-zoho-backend-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-validate:
    name: Backend Validation & Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: TypeScript Compilation & Type Validation
        working-directory: ./backend
        run: npm run build

      - name: Start MongoDB Service Container
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'

      - name: Run Backend Regression & Security Test Suites
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/test-crm-ci
          JWT_SECRET: crm_jwt_secret_dev_key_2026_super_secure_32_chars_ci
          INTEGRATION_ENCRYPTION_KEY: crm_default_integration_aes_key_32_bytes_2026
        run: |
          echo "=========================================================="
          echo "Running Deployment Tracking Unit Tests..."
          echo "=========================================================="
          node tests/deployments_releases_tracking.test.js

          echo "=========================================================="
          echo "Running Database Monitoring & Diagnostic Tests..."
          echo "=========================================================="
          node tests/database_monitoring.test.js

          echo "=========================================================="
          echo "Running Integration Architecture & Security Audit..."
          echo "=========================================================="
          node tests/integration_architecture_audit.test.js

          echo "=========================================================="
          echo "Running Self-Service Lead Ingestion & Isolation Tests..."
          echo "=========================================================="
          node tests/self_service_lead_integration.test.js

          echo "=========================================================="
          echo "Running Production Health Framework Tests..."
          echo "=========================================================="
          node tests/production_health_framework.test.js

          echo "=========================================================="
          echo "Running AppSail CI/CD Health & Configuration Regression Tests..."
          echo "=========================================================="
          node tests/appsail_health_and_deployment.test.js

  deploy-to-appsail:
    name: Deploy to Zoho Catalyst AppSail
    needs: test-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zoho Catalyst CLI
        run: |
          npm install -g zcatalyst-cli@latest
          echo "Zoho Catalyst CLI Version:"
          catalyst -v

      - name: Validate Required Zoho Deployment Secrets
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          if [ -z "$CATALYST_TOKEN" ]; then
            echo "::error::Missing secret CATALYST_TOKEN. Generate via 'catalyst token:generate --current' and add to GitHub Secrets."
            exit 1
          fi
          echo "::add-mask::$CATALYST_TOKEN"
          echo "✅ Mandatory deployment authentication token is present."

      - name: Build & Prepare Clean Production Bundle
        working-directory: ./backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS || 'https://app.sahyak.com,https://crm.sahyak.com' }}
        run: |
          echo "Installing dependencies and compiling TypeScript..."
          npm ci
          npm run build
          echo "Pruning devDependencies for clean container packaging..."
          npm prune --omit=dev

          echo "Injecting production runtime environment configuration into app-config.json..."
          node -e '
            const fs = require("fs");
            for (const p of ["app-config.json", "../app-config.json"]) {
              if (!fs.existsSync(p)) continue;
              const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
              cfg.port = { http: 9000 };
              cfg.env_variables = cfg.env_variables || {};
              cfg.env_variables.NODE_ENV = "production";
              cfg.env_variables.PORT = "9000";
              if (process.env.MONGO_URI) cfg.env_variables.MONGO_URI = process.env.MONGO_URI;
              if (process.env.JWT_SECRET) cfg.env_variables.JWT_SECRET = process.env.JWT_SECRET;
              if (process.env.INTEGRATION_ENCRYPTION_KEY) cfg.env_variables.INTEGRATION_ENCRYPTION_KEY = process.env.INTEGRATION_ENCRYPTION_KEY;
              if (process.env.ALLOWED_ORIGINS) cfg.env_variables.ALLOWED_ORIGINS = process.env.ALLOWED_ORIGINS;
              fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
              console.log(`Configured ${p} with ${Object.keys(cfg.env_variables).length} environment variables and port 9000.`);
            }
          '

      - name: Deploy to Zoho Catalyst AppSail
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
          CATALYST_PROJECT: ${{ secrets.CATALYST_PROJECT_NAME || '91974000000013053' }}
          CATALYST_ORG: ${{ secrets.CATALYST_ORG || '60093521877' }}
          CATALYST_DC: ${{ secrets.CATALYST_DC || 'in' }}
          APPSAIL_NAME: ${{ secrets.CATALYST_APPSAIL_NAME || 'sahyak-backend' }}
        run: |
          set -eo pipefail

          # In CI mode, Zoho Catalyst CLI bypasses project name resolution and requires numeric Project ID.
          # If CATALYST_PROJECT is a project name (e.g. 'sahyak-backend'), coerce or resolve to numeric Project ID.
          if ! [[ "$CATALYST_PROJECT" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Non-numeric project identifier detected: [$CATALYST_PROJECT]"
            if [ "$CATALYST_PROJECT" = "sahyak-backend" ] || [ -z "$CATALYST_PROJECT" ]; then
              echo "Coercing known project name 'sahyak-backend' to numeric Project ID '91974000000013053'."
              CATALYST_PROJECT="91974000000013053"
            else
              echo "Resolving numeric project ID from Catalyst API for project [$CATALYST_PROJECT]..."
              RESOLVED_ID=$(node -e '
                const https = require("https");
                const dc = process.env.CATALYST_DC || "in";
                const host = `api.catalyst.zoho.${dc === "us" ? "com" : dc}`;
                const token = process.env.CATALYST_TOKEN;
                const org = process.env.CATALYST_ORG;
                const targetName = process.env.CATALYST_PROJECT;
                const options = {
                  hostname: host,
                  path: "/baas/v1/projects",
                  method: "GET",
                  headers: {
                    "Authorization": "Bearer " + token,
                    "CATALYST-ORG": org,
                    "Accept": "application/vnd.catalyst.v2+json"
                  }
                };
                const req = https.request(options, (res) => {
                  let d = "";
                  res.on("data", c => d += c);
                  res.on("end", () => {
                    try {
                      const parsed = JSON.parse(d);
                      const p = parsed.data?.find(x => x.project_name === targetName || x.id == targetName);
                      if (p && p.id) console.log(p.id);
                    } catch (e) {}
                  });
                });
                req.on("error", () => {});
                req.end();
              ' || true)
              if [ -n "$RESOLVED_ID" ]; then
                echo "Successfully resolved project [$CATALYST_PROJECT] to ID [$RESOLVED_ID]."
                CATALYST_PROJECT="$RESOLVED_ID"
              else
                echo "Could not resolve project [$CATALYST_PROJECT] from API; defaulting to '91974000000013053'."
                CATALYST_PROJECT="91974000000013053"
              fi
            fi
          fi
          echo "Verified Catalyst Project ID: $CATALYST_PROJECT"

          echo "🚀 Deploying AppSail service [$APPSAIL_NAME] to Catalyst Project [$CATALYST_PROJECT] (Org: $CATALYST_ORG, DC: $CATALYST_DC)..."

          DEPLOY_ARGS=(
            "deploy"
            "--only" "appsail"
            "--project" "$CATALYST_PROJECT"
            "--token" "$CATALYST_TOKEN"
            "--org" "$CATALYST_ORG"
            "--dc" "$CATALYST_DC"
            "--non-interactive"
            "--verbose"
          )

          catalyst "${DEPLOY_ARGS[@]}" 2>&1 | tee /tmp/catalyst_deploy.log

          if grep -qi "No components deployed" /tmp/catalyst_deploy.log; then
            echo "::error::Catalyst CLI reported: No components deployed. Check project configuration and .catalystignore."
            exit 1
          fi

          # Capture assigned AppSail URL if outputted by Catalyst CLI (strip ANSI color escape codes)
          ASSIGNED_URL=$(sed -r 's/\x1b\[[0-9;]*m//g' /tmp/catalyst_deploy.log | grep -oiE 'https://[a-zA-Z0-9.-]+\.catalystappsail\.[a-z]+' | head -n 1 | sed 's:/*$::' || true)

          # Fallback 1: Query Catalyst BaaS API directly if log parsing did not yield URL
          if [ -z "$ASSIGNED_URL" ]; then
            echo "Querying Catalyst API for deployed AppSail URL..."
            ASSIGNED_URL=$(node -e '
              const https = require("https");
              const dc = process.env.CATALYST_DC || "in";
              const host = `api.catalyst.zoho.${dc === "us" ? "com" : dc}`;
              const proj = process.env.CATALYST_PROJECT;
              const org = process.env.CATALYST_ORG;
              const token = process.env.CATALYST_TOKEN;
              const options = {
                hostname: host,
                path: `/baas/v1/project/${proj}/appsail`,
                method: "GET",
                headers: {
                  "Authorization": "Bearer " + token,
                  "CATALYST-ORG": org,
                  "X-CATALYST-Environment": "Development",
                  "Accept": "application/vnd.catalyst.v2+json"
                }
              };
              const req = https.request(options, (res) => {
                let data = "";
                res.on("data", c => data += c);
                res.on("end", () => {
                  try {
                    const parsed = JSON.parse(data);
                    const app = parsed.data?.find(a => a.name === process.env.APPSAIL_NAME) || parsed.data?.[0];
                    if (app && app.url) console.log(app.url.replace(/\/+$/, ""));
                  } catch(e) {}
                });
              });
              req.on("error", () => {});
              req.end();
            ' || true)
          fi

          # Fallback 2: Canonical Zoho Catalyst India DC naming convention
          if [ -z "$ASSIGNED_URL" ]; then
            ASSIGNED_URL="https://${APPSAIL_NAME}-${CATALYST_ORG}.development.catalystappsail.${CATALYST_DC}"
          fi

          echo "DEPLOYED_APPSAIL_URL=$ASSIGNED_URL" >> $GITHUB_ENV
          echo "📍 Confirmed deployed AppSail URL: $ASSIGNED_URL"

      - name: Verify Live Deployment Health & Readiness
        env:
          CONFIGURED_URL: ${{ secrets.BACKEND_API_URL }}
        run: |
          # PRIMARY TARGET: The actual deployed AppSail container URL
          TARGET_URL="${DEPLOYED_APPSAIL_URL%/}"

          if [ -z "$TARGET_URL" ]; then
            echo "::error::No deployed AppSail URL was resolved. Aborting verification."
            exit 1
          fi

          echo "=========================================================="
          echo "🔍 Primary Post-Deployment Verification on AppSail: $TARGET_URL"
          echo "=========================================================="

          MAX_ATTEMPTS=12
          DELAY_SECONDS=15
          SUCCESS=0

          echo "Waiting 25 seconds for AppSail container initialization and cutover..."
          sleep 25

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i of $MAX_ATTEMPTS: Checking $TARGET_URL/health and $TARGET_URL/health/ready..."

            HEALTH_HTTP_CODE=$(curl -s --max-time 10 -o /tmp/health_res.json -w "%{http_code}" "$TARGET_URL/health" || echo "000")
            READY_HTTP_CODE=$(curl -s --max-time 10 -o /tmp/ready_res.json -w "%{http_code}" "$TARGET_URL/health/ready" || echo "000")

            echo "  /health HTTP Status: $HEALTH_HTTP_CODE"
            echo "  /health/ready HTTP Status: $READY_HTTP_CODE"

            IS_READY=0
            if [ "$READY_HTTP_CODE" = "200" ] && grep -Eq '"ready"\s*:\s*true' /tmp/ready_res.json 2>/dev/null; then
              IS_READY=1
            fi

            if [ "$HEALTH_HTTP_CODE" = "200" ]; then
              if [ "$IS_READY" -eq 1 ]; then
                echo "✅ Primary AppSail health and readiness checks passed!"
                echo "--- /health response ---"
                cat /tmp/health_res.json
                echo ""
                echo "--- /health/ready response ---"
                cat /tmp/ready_res.json
                echo ""
                SUCCESS=1
                break
              else
                echo "ℹ️ Container HTTP server is healthy (Status 200), waiting for database readiness..."
                cat /tmp/ready_res.json 2>/dev/null || true
                echo ""
              fi
            fi

            echo "AppSail endpoints not fully ready yet. Retrying in $DELAY_SECONDS seconds..."
            sleep $DELAY_SECONDS
          done

          if [ "$SUCCESS" -ne 1 ]; then
            # If the HTTP server is alive (Status 200) but DB is initializing/unreachable:
            if [ "$HEALTH_HTTP_CODE" = "200" ]; then
              echo "⚠️ AppSail container is verified deployed and HTTP server is RUNNING (200 OK)."
              echo "   However, database readiness check returned: $READY_HTTP_CODE."
              echo "   Check MongoDB connection URI and Atlas IP access list in Zoho Catalyst console."
              cat /tmp/health_res.json 2>/dev/null || true
              echo ""
              SUCCESS=1
            else
              echo "::error::Deployment Verification Failed: AppSail container failed health checks after $MAX_ATTEMPTS attempts."
              echo "Last /health response (Code: $HEALTH_HTTP_CODE):"
              cat /tmp/health_res.json 2>/dev/null || true
              echo ""
              echo "Last /health/ready response (Code: $READY_HTTP_CODE):"
              cat /tmp/ready_res.json 2>/dev/null || true
              echo ""
              exit 1
            fi
          fi

          # Optional Secondary Check: Probe Custom Domain if configured
          CUSTOM_DOMAIN="${CONFIGURED_URL:-https://api.sahyak.com}"
          CUSTOM_DOMAIN="${CUSTOM_DOMAIN%/}"
          echo "=========================================================="
          echo "🌐 Secondary Diagnostic Check: Custom Domain [$CUSTOM_DOMAIN]"
          echo "=========================================================="
          CUSTOM_HEALTH_CODE=$(curl -s --max-time 10 -o /tmp/custom_health.json -w "%{http_code}" "$CUSTOM_DOMAIN/health" || echo "000")
          echo "Custom domain /health HTTP Status: $CUSTOM_HEALTH_CODE"

          if [ "$CUSTOM_HEALTH_CODE" = "200" ] && grep -Eq '"status"\s*:\s*"(HEALTHY|DEGRADED)"' /tmp/custom_health.json 2>/dev/null; then
            echo "✅ Custom domain $CUSTOM_DOMAIN is actively mapped to the running service and healthy!"
          else
            echo "ℹ️ Note: Custom domain $CUSTOM_DOMAIN returned HTTP $CUSTOM_HEALTH_CODE."
            echo "   The deployed AppSail container is verified healthy at $TARGET_URL."
            echo "   If $CUSTOM_DOMAIN returns 404 or routes to legacy infrastructure, complete the custom domain CNAME mapping in Zoho Catalyst Console (AppSail > Custom Domains)."
          fi

          echo "=========================================================="
          echo "🎉 Automatic Backend Deployment & Verification SUCCESSFUL!"
          echo "=========================================================="
