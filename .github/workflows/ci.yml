name: CI / Production Build & Test Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Validation & Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start MongoDB Service
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'

      - name: Run Backend Integration & Security Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/test-crm-ci
          JWT_SECRET: crm_jwt_secret_dev_key_2026
          INTEGRATION_ENCRYPTION_KEY: crm_default_integration_aes_key_32_bytes_2026
        run: |
          node tests/self_service_lead_integration.test.js
          node tests/integration_architecture_audit.test.js

  frontend-build:
    name: Frontend Typecheck & Static Export Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Static Export
        working-directory: ./frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api-app.sahyak.com/api
        run: npm run build
